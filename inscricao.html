<!DOCTYPE html>

<head>
    <title>INSCRIÇÃO PARA O EVENTO</title>

<body style="background-color: rgba(86, 86, 196, 0.911)">
    <form>
        <legend>Dados Pessoais:</legend><br>
        
        <label for="nome_completo">Nome Completo:</label>
        <input type="text" id="nome_completo" name="nome_completo"><br><br>

        <label for="data_nascimento">Data de Nascimento:</label>
        <input type="date" id="data_nascimento" name="data_nascimento"><br><br>

        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14"><br><br>

        <label for="email">E-Mail:</label>
        <input type="email" id="email" name="email">

        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha"><br><br>

        <hr>

        <legend>Endereço:</legend><br>

        <label for="cep">CEP:</label>
        <input type="text" id="cep" name="cep" placeholder="00000-000" maxlength="8"><br><br>

        <label for="rua">Rua:</label>
        <input type="text" id="rua" name="cep">

        <label for="numero">Número:</label>
        <input type="number" id="numero" name="numero">

        <label for="complemento">Complemento:</label>
        <select id="complemento" name="complemento">
            <option value="casa">Casa</option>
            <option value="apartamento">Apartamento</option>
        </select><br><br>

        <label for="bairro">Bairro:</label>
        <input type="text" id="bairro" name="bairro">

        <label for="cidade">Cidade:</label>
        <input type="text" id="cidade" name="cidade">

        <label for="estado">Estado</label>
        <select>
            <option value="ce">Ceará</option>
            <option value="df">Distrito Federal</option>
            <option value="es">Espírito Santo</option>
            <option value="go">Goiás</option>
            <option value="ma">Maranhão</option>
        </select><br><br>

        <hr>

        <legend>Situação:</legend><br>
        
        <input type="radio" id="estudante" name="situacao" value="estudante">
        <label for="estudante">Estudante</label><br>

        <input type="radio" id="professor
        " name="situacao" value="professor">
        <label for="professor">Professor</label><br>

        <input type="radio" id="profissional_da_area" name="situacao" value="profissional_da_area">
        <label for="profissional_da_area">Profissional da área</label><br>

        <input type="radio" id="outro" name="situacao" value="outro">
        <label for="outro">Outro</label> 

        <hr>

        <legend>Áreas de interesse:</legend><br>

        <input type="checkbox" id="ia" name="ia" value="inteligencia_artificial">
        <label for="ia">Inteligência Artificial</label><br>

        <input type="checkbox" id="dev_web" name="dev_web" value="desenvolvimento_web">
        <label for="dev_web">Desenvolvimento Web</label><br>

        <input type="checkbox" id="rd" name="rd" value="redes">
        <label for="rd">Redes</label><br>

        <input type="checkbox" id="seg" name="seg" value="seguranca">
        <label for="seg">Segurança</label><br>

        <input type="checkbox" id="bd" name="bd" value="banco_de_dados">
        <label for="bd">Banco de Dados</label><br>

        <input type="checkbox" id="comp_g" name="
        comp_g" value="computacao_grafica">
        <label for="comp_g">Computação Gráfica</label><br>

        <input type="checkbox" id="pgm" name="pgm" value="programacao">
        <label for="pgm">Programação</label>

        <hr>

        <legend>Oficinas:</legend><br>

        <input type="checkbox" id="of_ia" name="of_ia" value="ofc_inteligencia_artificial">
        <label for="ia">Inteligência Artificial</label><br>

        <input type="checkbox" id="of_dev_web" name="of_dev_web" value="ofc_desenvolvimento_web">
        <label for="dev_web">Desenvolvimento Web</label><br>

        <input type="checkbox" id="of_rd" name="of_rd" value="ofc_redes">
        <label for="of_rd">Redes</label><br>

        <input type="checkbox" id="of_seg" name="of_seg" value="ofc_seguranca">
        <label for="of_seg">Segurança</label><br>

        <input type="checkbox" id="of_bd" name="of_bd" value="ofc_banco_de_dados">
        <label for="of_bd">Banco de Dados</label><br>

        <input type="checkbox" id="of_comp_g" name="
        of_comp_g" value="ofc_computacao_grafica">
        <label for="of_comp_g">Computação Gráfica</label><br>

        <input type="checkbox" id="of_pgm" name="of_pgm" value="ofc_programacao">
        <label for="of_pgm">Programação</label><br>

        <hr>

        <legend>Experiência em programação:</legend><br>
        
        <input type="radio" id="nenhuma" name="exp" value="nenhuma">
        <label for="nenhuma">Nenhuma experiência</label><br>

        <input type="radio" id="iniciante
        " name="exp" value="iniciante">
        <label for="iniciante">Iniciante</label><br>

        <input type="radio" id="intermediario" name="exp" value="intermediario">
        <label for="intermediario">Intermediário</label><br>

        <input type="radio" id="avancado" name="exp" value="avancado">
        <label for="avancado">Avançado</label><br>

        <hr>

        <legend>Tempo de experiência:</legend>
        <textarea id="tempo_de_experiencia" name="tempo_de_experiencia" rows="4" cols="50"></textarea><br>

        <hr>

        <legend>Sistema Operacional:</legend><br>
        <input type="radio" id="wdws" name="so" value="wdws">
        <label for="wdws">Windows</label><br>

         <input type="radio" id="lnx" name="so" value="lnx">
        <label for="lnx">Linux</label><br>

         <input type="radio" id="macos" name="so" value="macos">
        <label for="macos">macOS</label><br>

         <input type="radio" id="andr" name="so" value="andr">
        <label for="andr">Android</label><br>

        <hr>

        <legend>Origem da divulgação:</legend>

        <input type="radio" id="inst" name="rs" value="inst">
        <label for="inst">Instagram</label><br>

         <input type="radio" id="wpp" name="rs" value="wpp">
        <label for="wpp">WhatsApp</label><br>

         <input type="radio" id="fcbk" name="rs" value="fcbk">
        <label for="fcbk">Facebook</label><br>

         <input type="radio" id="ttk" name="rs" value="ttk">
        <label for="ttk">TikTok</label><br>

        <hr>

        <legend>Termos e condições:</legend>
        <input type="checkbox" id="termo" name="termo" value="cncrd">
        <label for="termo">Li e concordo com as regras do evento.</label><br>

        <input type="checkbox" id="termo" name="termo" value="uso_img">
        <label for="termo">Autorizo o uso de minha imagem no evento.</label><br>

        <input type="checkbox" id="termo" name="termo" value="dsj_inf">
        <label for="termo">Desejo receber informações sobre eventos futuros.</label><br>
        
        <button type="submit">Enviar</button>
        <button type="reset">Limpar</button>
    </form> 
    </fieldset>
    

</body>
</head>
